<!DOCTYPE html>
<html lang=ar dir=rtl>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover>
  <title>يارا | Yara - Romantic Elevator</title>
  <script src=https://cdn.tailwindcss.com></script>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link href=https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap rel=stylesheet>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      user-select: none;
      overflow: hidden;
      background: #06070d;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }

    @keyframes elevatorSway {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
    }
    @keyframes blinkArrow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.8)); }
      50% { opacity: 0.2; filter: none; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }
    @keyframes musicPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(245, 158, 11, 0.8); }
    }

    .elevator-frame {
      animation: elevatorSway 6s ease-in-out infinite;
    }
    .blink {
      animation: blinkArrow 1.2s infinite ease-in-out;
    }
    .ambient-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .music-cta {
      animation: musicPulse 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class=h-screen w-screen flex items-center justify-center bg-[#05060b] text-white sm:p-4>

  <!-- إطار المصعد البانورامي الزجاجي -->
  <div class=relative z-10 w-full h-full sm:h-[90vh] sm:max-w-[1100px] sm:max-h-[820px] sm:rounded-3xl overflow-hidden shadow-[0_0_80px_rgba(0,0,0,0.95)] sm:border sm:border-white/20 flex flex-col elevator-frame bg-black>
    
    <!-- خلفية المصعد البانورامي (الصورة الأنمي الرومانسية المتجاوبة) -->
    <div class=absolute inset-0 z-0>
      <picture class=w-full h-full block>
        <source media=(max-width: 640px) srcset=anime_elevator_mobile.jpg>
        <img src=anime_elevator_romance.jpg 
             alt=Yara - Anime Panoramic Elevator Romance 
             class=w-full h-full object-cover object-center>
      </picture>

      <div class=absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/60 pointer-events-none></div>
      <div class=absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,200,140,0.25)_0%,transparent_60%)] pointer-events-none ambient-glow></div>
    </div>

    <!-- كانفاس حركة أضواء وبوكيه المدينة الصاعدة -->
    <canvas id=bokehCanvas class=absolute inset-0 z-10 pointer-events-none w-full h-full></canvas>

    <!-- لمعات وانعكاسات زجاج المصعد -->
    <div class=absolute inset-0 z-15 pointer-events-none bg-[linear-gradient(115deg,rgba(255,255,255,0.06)_0%,transparent_30%,rgba(255,255,255,0.03)_60%,transparent_100%)]></div>

    <!-- الشريط العلوي -->
    <div class=relative z-20 w-full pt-3 pb-2 px-3 sm:px-8 bg-gradient-to-b from-black/90 via-black/50 to-transparent flex items-center justify-between border-b border-white/10 backdrop-blur-sm gap-2>
      
      <!-- مؤشر النزول يبدأ من الدور 16 صامتاً بدون صوت رنين مزعج -->
      <div class=flex items-center gap-1.5 sm:gap-3 bg-black/75 px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-full border border-amber-500/40 backdrop-blur-md shadow-md shrink-0>
        <span class=text-amber-400 font-bold text-xs sm:text-base blink>▼</span>
        <span class=text-[9px] sm:text-xs uppercase tracking-wider text-white/70 font-semibold>FLOOR</span>
        <span id=floorNum class=text-amber-400 font-mono font-bold text-sm sm:text-xl tracking-wider>16</span>
        <span class=text-emerald-400 text-[8px] sm:text-xs font-semibold px-1.5 py-0.5 rounded bg-emerald-950/70 border border-emerald-500/30>DESCENDING</span>
      </div>

      <!-- زر الموسيقى الرومانسية الجديدة -->
      <div class=flex items-center gap-2 shrink-0>
        <button id=musicBtn onclick=toggleAudio() class=px-3.5 sm:px-5 py-1.5 sm:py-2 rounded-full bg-amber-500/30 hover:bg-amber-500/50 border border-amber-400 text-xs sm:text-sm text-amber-100 font-semibold flex items-center gap-2 transition-all shadow-lg active:scale-95>
          <span id=musicIcon class=text-base>▶️</span>
          <span id=musicLabel>تشغيل النغمة الهادئة</span>
        </button>
      </div>

    </div>

    <!-- رسالة ترحيبية بالمنتصف لتشغيل النغمة الرومانسية فورياً -->
    <div id=startAudioOverlay onclick=toggleAudio() class=absolute inset-0 z-30 bg-black/40 backdrop-blur-[2px] flex items-center justify-center cursor-pointer transition-opacity duration-500>
      <div class=bg-gradient-to-b from-amber-950/90 to-black/95 border-2 border-amber-400/80 rounded-2xl px-6 py-4 text-center max-w-xs shadow-[0_0_40px_rgba(245,158,11,0.5)] music-cta>
        <div class=text-3xl mb-2>🎹</div>
        <h3 class=text-amber-200 font-bold text-base mb-1>اضغط لتشغيل النغمة الهادئة</h3>
        <p class=text-white/80 text-xs leading-relaxed>معزوفة بيانو رومانسية دافئة (River Flows in You - Style)</p>
      </div>
    </div>

    <!-- مساحة المنتصف المرئية -->
    <div class=relative z-20 flex-1 pointer-events-none></div>

    <!-- الشريط السفلي -->
    <div class=relative z-20 w-full bg-gradient-to-t from-black/95 via-black/80 to-transparent pt-3 pb-3 sm:pt-6 sm:pb-4 px-3 sm:px-8 border-t border-white/10 backdrop-blur-sm flex flex-col items-center justify-center text-center>
      <p class=text-xs sm:text-base font-medium text-amber-100/95 tracking-wide drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)] leading-relaxed max-w-[95%]>
        وبين صمت النزول وازدحام المشاعر.. كان كلٌّ منهما ينظر بعيداً، والقلب يلتفت للداخل.
      </p>
      <div class=flex items-center justify-between w-full mt-1.5 sm:mt-2 text-[9px] sm:text-xs text-white/45 font-mono>
        <span>YARA • PANORAMIC LIFT</span>
        <span>STARTING FROM FLOOR 16</span>
        <span>ROMANTIC PIANO MELODY</span>
      </div>
    </div>

  </div>

  <script>
    // 1. حركة أضواء وبوكيه المدينة
    const canvas = document.getElementById('bokehCanvas');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const colors = ['#f59e0b', '#fbbf24', '#38bdf8', '#c084fc', '#f43f5e', '#ffffff'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * (window.innerWidth || 400),
        y: Math.random() * (window.innerHeight || 700),
        r: Math.random() * 3 + 1,
        speed: Math.random() * 1.8 + 0.8,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function renderBokeh() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < -15) {
          p.y = canvas.height + 15;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(renderBokeh);
    }
    renderBokeh();

    // 2. عداد الأدوار يبدأ من 16 بدون أي رنين
    let floor = 16;
    const floorEl = document.getElementById('floorNum');
    setInterval(() => {
      floor--;
      if (floor < 1) floor = 16;
      floorEl.textContent = floor < 10 ? '0' + floor : floor;
    }, 4500);

    // 3. النغمة الرومانسية الجديدة (River Flows in You / Romantic Acoustic Piano Melody)
    let audioCtx = null;
    let isPlaying = false;
    let musicInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudio() {
      initAudio();
      const btn = document.getElementById('musicBtn');
      const lbl = document.getElementById('musicLabel');
      const icon = document.getElementById('musicIcon');
      const overlay = document.getElementById('startAudioOverlay');

      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 400);
      }

      if (isPlaying) {
        clearInterval(musicInterval);
        isPlaying = false;
        lbl.textContent = تشغيل النغمة الهادئة;
        icon.textContent = ▶️;
        btn.classList.remove('bg-emerald-500/30', 'border-emerald-400');
        btn.classList.add('bg-amber-500/30', 'border-amber-400');
      } else {
        isPlaying = true;
        lbl.textContent = إيقاف النغمة;
        icon.textContent = ⏸️;
        btn.classList.add('bg-emerald-500/30', 'border-emerald-400');
        btn.classList.remove('bg-amber-500/30', 'border-amber-400');
        playRiverRomance();
      }
    }

    // توليد نغمة بيانو صوتها طبيعي ومريح
    function playPianoNote(freq, dur = 2.5, delay = 0, vol = 0.12) {
      setTimeout(() => {
        if (!isPlaying || !audioCtx) return;
        try {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq, audioCtx.currentTime);

          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1600;

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(audioCtx.currentTime + dur);
          osc2.stop(audioCtx.currentTime + dur);
        } catch(e) {}
      }, delay);
    }

    function playRiverRomance() {
      // نغمات لحن رومانسي متدفق وعميق (River Flows In You Inspired Progression)
      // F#m -> D -> A -> E (متحول لسلم Am الدافئ: Am -> F -> C -> G)
      const phrasePatterns = [
        // Measure 1: Am (A2 - E3 - A3 - C4) مع اللحن (E5 -> D5 -> E5 -> C5)
        {
          bass: [220.00, 329.63, 440.00],
          melody: [
            { note: 659.25, time: 0 },    // E5
            { note: 587.33, time: 400 },  // D5
            { note: 659.25, time: 800 },  // E5
            { note: 523.25, time: 1400 }  // C5
          ]
        },
        // Measure 2: Fmaj (F2 - C3 - F3 - A3) مع اللحن (D5 -> C5 -> D5 -> A4)
        {
          bass: [174.61, 261.63, 349.23],
          melody: [
            { note: 587.33, time: 0 },    // D5
            { note: 523.25, time: 400 },  // C5
            { note: 587.33, time: 800 },  // D5
            { note: 440.00, time: 1400 }  // A4
          ]
        },
        // Measure 3: Cmaj (C3 - G3 - C4 - E4) مع اللحن (C5 -> B4 -> C5 -> G4)
        {
          bass: [130.81, 196.00, 261.63],
          melody: [
            { note: 523.25, time: 0 },    // C5
            { note: 493.88, time: 400 },  // B4
            { note: 523.25, time: 800 },  // C5
            { note: 392.00, time: 1400 }  // G4
          ]
        },
        // Measure 4: Gmaj / Em (G2 - D3 - G3 - B3) مع اللحن (B4 -> A4 -> B4 -> E5)
        {
          bass: [196.00, 293.66, 392.00],
          melody: [
            { note: 493.88, time: 0 },    // B4
            { note: 440.00, time: 400 },  // A4
            { note: 493.88, time: 800 },  // B4
            { note: 659.25, time: 1400 }  // E5
          ]
        }
      ];

      let phraseIdx = 0;
      function playStep() {
        if (!isPlaying) return;
        const phrase = phrasePatterns[phraseIdx % phrasePatterns.length];

        // عزف البيز المتتابع (Arpeggio)
        phrase.bass.forEach((note, i) => {
          playPianoNote(note, 3.2, i * 350, 0.09);
        });

        // عزف اللحن العاطفي
        phrase.melody.forEach(m => {
          playPianoNote(m.note, 2.2, m.time, 0.12);
        });

        phraseIdx++;
      }

      playStep();
      musicInterval = setInterval(playStep, 2400);
    }

    // تشغيل فوري بمجرد النقر في أي مكان
    window.addEventListener('click', function onFirstClick() {
      if (!isPlaying) {
        toggleAudio();
      }
    }, { once: true });
  </script>
</body>
</html>
