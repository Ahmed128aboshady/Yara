<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>يارا | Yara - Romantic Elevator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      color: #ffffff;
    }

    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .bg-picture {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.5) 100%);
      pointer-events-none;
      z-index: 2;
    }

    #bokehCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events-none;
      z-index: 5;
    }

    .glass-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, rgba(255,255,255,0.06) 0%, transparent 35%, rgba(255,255,255,0.02) 65%, transparent 100%);
      pointer-events-none;
      z-index: 6;
    }

    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
      z-index: 20;
    }

    .floor-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 9999px;
      padding: 6px 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
    }

    .arrow-down {
      color: #f59e0b;
      font-size: 14px;
      animation: blink 1.2s infinite ease-in-out;
    }

    .floor-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
    }

    .floor-number {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #f59e0b;
      min-width: 24px;
      text-align: center;
    }

    .floor-status {
      font-size: 9px;
      font-weight: 700;
      color: #34d399;
      background: rgba(6, 78, 59, 0.7);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .music-button {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.25);
      border: 1.5px solid #f59e0b;
      color: #fef3c7;
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 30;
    }

    .music-button:active {
      transform: scale(0.96);
    }

    .music-button.playing {
      background: rgba(16, 185, 129, 0.3);
      border-color: #10b981;
      color: #a7f3d0;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .start-card {
      background: linear-gradient(180deg, rgba(30, 20, 15, 0.95) 0%, rgba(10, 8, 12, 0.98) 100%);
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.6);
      animation: pulse 2.5s infinite ease-in-out;
      max-width: 320px;
    }

    .start-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .start-title {
      color: #fef3c7;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .start-desc {
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      line-height: 1.4;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 55px rgba(245, 158, 11, 0.8); }
    }

    @media (max-width: 600px) {
      .header-bar {
        padding: 0 12px;
        height: 60px;
      }
      .floor-badge {
        padding: 4px 10px;
        gap: 6px;
      }
      .floor-number {
        font-size: 15px;
      }
      .music-button {
        padding: 6px 14px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="romantic_piano.mp3" loop preload="auto"></audio>

  <div class="viewport-container" id="appContainer">

    <picture class="bg-picture">
      <source media="(max-width: 768px)" srcset="anime_elevator_mobile.jpg">
      <img src="anime_elevator_romance.jpg" alt="Yara - Romantic Elevator" class="bg-image">
    </picture>

    <div class="vignette-overlay"></div>
    <div class="glass-sheen"></div>

    <canvas id="bokehCanvas"></canvas>

    <header class="header-bar">
      <div class="floor-badge">
        <span class="arrow-down">▼</span>
        <span class="floor-title">FLOOR</span>
        <span id="floorNum" class="floor-number">16</span>
        <span class="floor-status">DESC</span>
      </div>

      <button id="musicBtn" class="music-button" type="button">
        <span id="musicIcon">▶️</span>
        <span id="musicLabel">تشغيل النغمة</span>
      </button>
    </header>

    <div id="startAudioOverlay" class="start-overlay">
      <div class="start-card">
        <div class="start-icon">🎹</div>
        <h3 class="start-title">اضغط لتشغيل النغمة الهادئة</h3>
        <p class="start-desc">معزوفة بيانو رومانسية دافئة<br>(Clair de Lune)</p>
      </div>
    </div>

  </div>

  <script>
    // 1. حركة أضواء وبوكيه المدينة
    const canvas = document.getElementById('bokehCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const colors = ['#f59e0b', '#fbbf24', '#38bdf8', '#c084fc', '#f43f5e', '#ffffff'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 3 + 1,
        speed: Math.random() * 1.8 + 0.8,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function renderBokeh() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < -15) {
          p.y = canvas.height + 15;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(renderBokeh);
    }
    renderBokeh();

    // 2. عداد الأدوار يبدأ من 16
    let floor = 16;
    const floorEl = document.getElementById('floorNum');
    setInterval(() => {
      floor--;
      if (floor < 1) floor = 16;
      floorEl.textContent = floor < 10 ? '0' + floor : floor;
    }, 4500);

    // 3. التحكم بالصوت
    const audio = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    const lbl = document.getElementById('musicLabel');
    const icon = document.getElementById('musicIcon');
    const overlay = document.getElementById('startAudioOverlay');

    let isPlaying = false;

    function playAudio() {
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 300);
      }

      audio.play().then(() => {
        isPlaying = true;
        lbl.textContent = 'إيقاف النغمة';
        icon.textContent = '⏸️';
        btn.classList.add('playing');
      }).catch(err => {
        console.warn('Playback error:', err);
      });
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      lbl.textContent = 'تشغيل النغمة';
      icon.textContent = '▶️';
      btn.classList.remove('playing');
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    if (overlay) {
      overlay.addEventListener('click', function(e) {
        playAudio();
      });
      overlay.addEventListener('touchstart', function(e) {
        playAudio();
      }, { passive: true });
    }

    if (btn) {
      btn.addEventListener('click', toggleAudio);
    }

    document.addEventListener('click', function globalClick() {
      if (!isPlaying) {
        playAudio();
      }
    }, { once: true });
  </script>
</body>
</html>
